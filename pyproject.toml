[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "european-remote"
version = "0.0.1"
description = 'European Remote Data Pipeline'
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = [
  "european-remote",
  "data-pipeline",
  "toy-data-pipeline",
  "apache-parquet",
  "pyarrow",
  "llm-data-extraction"
]
authors = [
  { name = "Luis Motta Campos", email = "1871839+luismottacampos@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "beautifulsoup4 >= 4.15",
  "requests >= 2.34",
  "langchain >= 1.4",
  "langchain-mistralai",
  "python-dotenv >= 1.2.4",
  "markdown >= 3.11",
  "pyarrow >= 26.0",
]

[project.urls]
Documentation = "https://github.com/luismottacampos/european-remote-data-pipeline#readme"
Issues = "https://github.com/luismottacampos/european-remote-data-pipeline/issues"
Source = "https://github.com/luismottacampos/european-remote-data-pipeline"

[tool.hatch.envs.default.scripts]
extractor = "python -m european_remote.extractor {args}"
fetcher = "python -m european_remote.fetcher {args}"
job_ad_extractor = "python -m european_remote.job_ad_extractor"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/european_remote tests}"

[tool.hatch.envs.lint]
extra-dependencies = [
  "black",
  "mypy>=1.0.0",
  "pylint",
  "autopep8",
  "flake8",
]

[tool.coverage.run]
source_pkgs = ["european_remote", "tests"]
branch = true
parallel = true
omit = [
  "src/european_remote/__about__.py",
]

[tool.coverage.paths]
european_remote = ["src/european_remote", "*/european-remote/src/european_remote"]
tests = ["tests", "*/european-remote/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
